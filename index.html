;document.getElementById("demo-root").innerHTML=markup;</script><script>// @ts-nocheck
let __started=false;

const $=s=>document.querySelector(s);
const FONT='Arial,"Liberation Sans",Helvetica,sans-serif';
const __SIM=(typeof location!=='undefined'&&/[?&]sim=1/.test(location.search));
const __nowMin=()=>{const t=new Date();return t.getHours()*60+t.getMinutes()};
let START=__SIM?540:Math.floor(__nowMin()/15)*15; // case clock start (minutes): 09:00 in sim mode, otherwise the current quarter hour (device time)
const fmt=m=>{m=Math.round(m);const h=Math.floor(m/60)%24,mm=((m%60)+60)%60;return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0')};

const wall=()=>new Date().toISOString();

function rnd(a,b){return a+Math.random()*(b-a)}
const sim={hr:78,spo2:98,co2:38,rr:12,sys:112,dia:68,map:83,nibpAt:START-5,nibpOn:true,abn:false};
function simStep(){

  sim.hr=Math.round(Math.min(130,Math.max(48,sim.hr+rnd(-2.5,2.5))));
  sim.spo2=Math.round(Math.min(100,Math.max(94,sim.spo2+rnd(-1,1))));
  sim.co2=Math.round(Math.min(46,Math.max(32,sim.co2+rnd(-1.5,1.5))));
  sim.rr=Math.round(Math.min(18,Math.max(8,sim.rr+rnd(-1,1))));
  if(sim.nibpOn&&S.clock-sim.nibpAt>=5){sim.nibpAt=S.clock;sim.sys=Math.round(rnd(100,128));sim.dia=Math.round(rnd(58,78));sim.map=Math.round((sim.sys+2*sim.dia)/3)}
}
const LAY={W:960,H:540,
 hr:{x:640,y:44,w:300,h:110,font:96,col:'#35e06a',key:'hr',maxd:3,colr:'green'},
 spo2:{x:640,y:164,w:300,h:100,font:84,col:'#38e0e8',key:'spo2',maxd:3,colr:'cyan'},
 co2:{x:640,y:272,w:170,h:90,font:76,col:'#ff7a2a',key:'co2',maxd:3,colr:'orange'},
 rr:{x:830,y:290,w:90,h:56,font:44,col:'#ff7a2a',key:'rr',maxd:2,colr:'orange'},
 sys:{x:660,y:372,w:140,h:70,font:62,col:'#f2f2f2',key:'sys',maxd:3,colr:'white'},
 dia:{x:660,y:446,w:140,h:70,font:62,col:'#f2f2f2',key:'dia',maxd:3,colr:'white'},
 map:{x:834,y:412,w:100,h:56,font:44,col:'#f2f2f2',key:'map',maxd:3,colr:'white'}};
const PARAMS=['hr','spo2','co2','rr','sys','dia','map'];
const PLABEL={hr:'HR',spo2:'SpO2',co2:'EtCO2',rr:'RR',sys:'NIBP sys',dia:'NIBP dia',map:'NIBP MAP'};
const PUNIT={hr:'bpm',spo2:'%',co2:'mmHg',rr:'/min',sys:'mmHg',dia:'mmHg',map:'mmHg'};
function drawMonitor(ctx,vals,opts){
  opts=opts||{};const W=960,H=540;ctx.save();ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#bbb';ctx.font='14px '+FONT;ctx.textBaseline='middle';
  ctx.fillText('Patient    Monitor Setup    Print Setup    Parameters    Functions',14,16);ctx.textAlign='right';ctx.fillText('SIM '+fmt(S.clock),W-12,16);ctx.textAlign='left';
  const ph=S.clock*0.9;
  const wave=(y0,h,col,f)=>{ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();for(let x=20;x<610;x++){const t=x/18+ph;const y=y0+h/2-f(t)*h/2;x==20?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()};
  wave(60,110,'#35e06a',t=>{const u=(t%(Math.PI*2))/(Math.PI*2);return u<.08?.9:u<.12?-.25:u<.2?.2*Math.sin(u*30):0});

  wave(320,110,'#ff7a2a',t=>Math.max(-.6,Math.min(.8,Math.sin(t*.35)*2)));

  if(vals){PARAMS.forEach(k=>put(k,vals[k]))}
  ctx.font='14px '+FONT;ctx.fillStyle='#667';ctx.textAlign='left';
  ctx.fillText('HR bpm',628,40);ctx.fillText('SpO2 %',628,158);ctx.fillText('EtCO2 mmHg',628,266);ctx.fillText('rpm',900,360);ctx.fillText('NIBP',628,366);ctx.fillText('Interval: 5 min',810,500);
  ctx.fillStyle='#666';ctx.font='bold 40px '+FONT;ctx.fillText('(',812,446);ctx.fillText(')',928,446);

      es.onmessage=ev=>{try{const m=JSON.parse(ev.data);if(m.event==='message'&&m.attachment&&m.attachment.url&&(m.time||0)*1000>=lastSnap){lastSnap=(m.time||0)*1000;const u=m.attachment.url;const im=new Image();im.onload=()=>{si.src=u};im.onerror=()=>{};im.src=u}}catch(e){}};es.onerror=()=>{try{es.close()}catch(e){}setTimeout(open,5000)}};open();
    setInterval(()=>{if(!lastSnap)return;const s=Math.round((Date.now()-lastSnap)/1000);sc.textContent='Camera snapshot, '+(s<90?s+'s':Math.round(s/60)+' min')+' ago (still image, not video; test only, no patient identifiers)'},1000)}
  if(PAIR.role==='entry'){const cs=document.getElementById('ccstat');if(cs)cs.style.display='none';const rb=document.getElementById('ccrot');if(rb)rb.style.display='none'}
  if(PAIR.role==='entry')setInterval(renderVT,3000);
  pairStatus();pairListen();
  bar.onclick=()=>{const open=pn.style.display==='none';pn.style.display=open?'':'none';if(!open)return;
    const cur=PAIR.role,oth=cur==='entry'?'cam':'entry';
    pn.innerHTML='<b>Phone pairing (test only, no patient identifiers)</b><br>This phone is the <b>'+(cur==='entry'?'ENTRY phone (receives readings, you enter drugs and times)':cur==='cam'?'CAMERA phone (reads the monitor, sends numbers only)':'unpaired device')+'</b>. Android opens as camera and iPhone/iPad as entry automatically; same page link on both, no code. Room: '+esc(PAIR.room)+' (public relay ntfy.sh, unlisted not secret, kept about 12 h).<div class="row" style="margin:6px 0"><button class="cc" id="pswitch">Switch this phone to '+(oth==='entry'?'ENTRY':'CAMERA')+'</button></div>';
    document.getElementById('pswitch').onclick=()=>{try{localStorage.setItem('anesRole',oth)}catch(e){}location.href=location.pathname+(location.search.replace(/[?&](role|room)=[^&]*/g,'').replace(/^&/,'?')||'')}}}

/* ---------- drug picker: tap a generic name, enter dose and time yourself. No suggested doses. ---------- */
function pickInit(){const box=document.getElementById('dchips');if(!box)return;const flt=document.getElementById('dfilter'),form=document.getElementById('dform'),sel=document.getElementById('dsel'),du=document.getElementById('dunit');let cur=null;
  const draw=()=>{const q=(flt.value||'').trim().toLowerCase();const list=DRUGS.filter(x=>!q||x.gen.toLowerCase().includes(q)||x.name.toLowerCase().includes(q)||x.al.some(a=>a.includes(q)));
    box.innerHTML=list.map(x=>'<button type="button" class="chip'+(cur&&cur.id===x.id?' on':'')+'" data-id="'+x.id+'">'+esc(x.gen)+(x.row!=null?' <span class="chk" title="has a row on the chart">&#9679;</span>':'')+'</button>').join('')||'<span class="small">No match. Type it in the free text box below.</span>'};
  box.onclick=e=>{const b=e.target.closest('button');if(!b)return;cur=DRUGS.find(x=>x.id===b.dataset.id);sel.textContent=cur.gen+(cur.name!==cur.gen?' ('+cur.name+' row)':'');
    du.innerHTML=['mg','mcg','g','units','mcg/kg/min'].filter(u=>u===cur.unit||(cur.row==null&&u!=='mcg/kg/min')).map(u=>'<option'+(u===cur.unit?' selected':'')+'>'+u+'</option>').join('');dirty=false;live();form.style.display='';draw();document.getElementById('ddose').focus()};
  const tf=document.getElementById('dtime');let dirty=false;const hhmm=m=>{m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
  const live=()=>{if(!dirty)tf.value=hhmm(__nowMin())};live();setInterval(live,10000);tf.oninput=()=>{dirty=true};
  form.addEventListener('click',e=>{const b=e.target.closest('[data-st]');if(b){const cur0=parseHHMM(tf.value);const base=cur0==null?__nowMin():cur0;tf.value=hhmm(base+parseInt(b.dataset.st,10));dirty=true}if(e.target.id==='dnow'){dirty=false;live()}});
  flt.oninput=draw;draw();
  document.getElementById('dclr').onclick=()=>{cur=null;form.style.display='none';flt.value='';draw()};
  document.getElementById('dadd').onclick=()=>{if(!cur)return;const dose=parseFloat(document.getElementById('ddose').value),tv=document.getElementById('dtime').value.trim(),unit=du.value;
    if(isNaN(dose)||dose<=0){alert('Enter the dose you gave (a number).');return}
    let given=S.clock,src='now (entry time)';if(tv){const g=parseHHMM(tv);if(g==null){alert('Time must be HH:MM (24 h), or leave blank for now.');return}given=g;src='typed by you ('+tv+')'}
    const hold=[];if(cur.row!=null&&unit!==cur.unit)hold.push('Chart row for '+cur.name+' is in '+cur.unit+'. Fix the unit or dose before confirming.');
    const p={raw:cur.gen+' '+dose+' '+unit+(tv?' at '+tv:' now')+' (picked from list)',drug:cur.id,dose:dose,unit:cur.row==null?unit:cur.unit,given:given,givenSrc:src,warn:[],hold:hold};
    addDrug(p);renderDrugs();updateBadges();document.getElementById('ddose').value='';dirty=false;live();form.style.display='none';cur=null;flt.value='';draw()}}

try{start()}catch(e){var p=document.createElement("pre");p.style.color="#a00";p.textContent=String(e&&e.stack||e);document.getElementById("demo-root").prepend(p)}</script></body></html>
